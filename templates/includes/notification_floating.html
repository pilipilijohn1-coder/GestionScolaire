{% load static %}

<!-- FAB NOTICEUR DE NOTIFICATIONS -->
<div class="notification-float">
    <button id="notification-float-btn" class="notification-float-btn" title="Notifications">
        <i class="fa-solid fa-bell"></i>
        {% if nb_notifications_non_lues > 0 %}
        <span class="notification-badge">{{ nb_notifications_non_lues }}</span>
        {% endif %}
    </button>
</div>

<!-- POPUP DE NOTIFICATIONS -->
<div id="notification-popup" class="notification-popup">
    <div class="notification-popup-header">
        <h3>Notifications</h3>
        <button id="notification-popup-close" class="close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div id="notification-popup-body" class="notification-popup-body">
        <div style="padding: 20px; text-align: center; color: #6b7280; font-size: 13px;">
            Chargement des notifications...
        </div>
    </div>
    <div class="notification-popup-footer">
        <div class="notification-popup-footer__links">
            <a href="{% url 'liste_notifications' %}">Notifications actives</a>
            <a href="{% url 'historique_notifications' %}">Historique</a>
        </div>
        <div id="notification-popup-count" class="notification-popup-count"></div>
    </div>
</div>

{% include 'includes/notification_detail.html' %}

<script>
var notificationBtn = document.getElementById('notification-float-btn');
var notificationPopup = document.getElementById('notification-popup');
var notificationPopupClose = document.getElementById('notification-popup-close');
var notificationPopupBody = document.getElementById('notification-popup-body');

if (notificationBtn && notificationPopup) {
    notificationBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        notificationPopup.classList.toggle('notification-popup--open');
        if (notificationPopup.classList.contains('notification-popup--open')) {
            loadNotifications();
        }
    });

    notificationPopupClose.addEventListener('click', function() {
        notificationPopup.classList.remove('notification-popup--open');
    });

    notificationPopup.addEventListener('click', function(e) {
        e.stopPropagation();
    });

    window.addEventListener('click', function() {
        notificationPopup.classList.remove('notification-popup--open');
    });
}

function echapperHtml(texte) {
    if (texte === null || texte === undefined) {
        return '';
    }

    return String(texte)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function loadNotifications() {
        fetch("{% url 'ajax_notifications_recentes' %}")
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Erreur HTTP " + response.status);
                }
                return response.json();
            })
            .then(function(data) {
                var html = '';
                if (data.notifications && data.notifications.length > 0) {
                    data.notifications.forEach(function(notif) {
                        var unreadClass = notif.lu ? '' : 'notification-popup-item--unread';
                        html += '<div class="notification-popup-item ' + unreadClass + '"'
                            + ' role="button" tabindex="0"'
                            + ' data-destinataire-id="' + notif.id + '"'
                            + ' title="Cliquer pour afficher le message">';
                        html += '<span class="notification-type type-' + echapperHtml(notif.type_code) + '">' + echapperHtml(notif.type_code).toUpperCase() + '</span>';
                        html += '<span class="notification-title">' + echapperHtml(notif.objet) + '</span>';
                        html += '<span class="notification-text">' + echapperHtml(notif.contenu) + '</span>';
                        html += '<span class="notification-date">' + echapperHtml(notif.date_creation) + '</span>';
                        html += '<span class="notification-open-hint"><i class="fa-solid fa-envelope-open"></i> Cliquer pour lire</span>';
                        html += '</div>';
                    });
                } else {
                    html = '<div class="notification-popup-empty"><i class="fas fa-inbox"></i>Aucune notification pour le moment.</div>';
                }
                notificationPopupBody.innerHTML = html;
                if (window.majCount) window.majCount(data.nb_non_lues);
                brancherClicsNotificationsPopup();
            })
            .catch(function(error) {
                console.error('Erreur:', error);
                notificationPopupBody.innerHTML = '<div style="padding: 20px; text-align: center; color: #ef4444; font-size: 13px;">Erreur lors du chargement.</div>';
            });
    }

function retirerNotificationPopup(destinataireId) {
    var item = notificationPopupBody.querySelector('[data-destinataire-id="' + destinataireId + '"]');

    if (!item) {
        return;
    }

    item.classList.add('notification-popup-item--retrait');

    window.setTimeout(function() {
        item.remove();

        if (!notificationPopupBody.querySelector('.notification-popup-item')) {
            notificationPopupBody.innerHTML = '<div class="notification-popup-empty"><i class="fas fa-inbox"></i>Plus aucune notification active.<br>Consultez l\'historique.</div>';
        }
    }, 200);
}

function brancherClicsNotificationsPopup() {
    notificationPopupBody.querySelectorAll('.notification-popup-item[data-destinataire-id]').forEach(function(item) {
        var ouvrir = function(e) {
            e.stopPropagation();
            e.preventDefault();

            if (item.dataset.ouverture === '1') {
                return;
            }

            item.dataset.ouverture = '1';

            window.ouvrirNotification(item.dataset.destinataireId, function() {
                retirerNotificationPopup(item.dataset.destinataireId);
            });
        };

        item.addEventListener('click', ouvrir);
        item.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                ouvrir(e);
            }
        });
    });
}
</script>
